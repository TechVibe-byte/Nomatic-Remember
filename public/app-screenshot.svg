<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" style="background:#070a13; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1e38" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="telegramGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="bulbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#fbbf24" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Browser Frame Window -->
  <rect x="15" y="15" width="1170" height="650" rx="16" fill="#0b0f19" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)" />

  <!-- Window Header Bar -->
  <path d="M 15 31 C 15 22.1 22.1 15 31 15 L 1169 15 C 1177.9 15 1185 22.1 1185 31 L 1185 55 L 15 55 Z" fill="#090d16" />
  <circle cx="40" cy="35" r="6" fill="#ef4444" />
  <circle cx="60" cy="35" r="6" fill="#f59e0b" />
  <circle cx="80" cy="35" r="6" fill="#10b981" />
  <rect x="360" y="24" width="480" height="22" rx="6" fill="#1e293b" />
  <text x="600" y="39" fill="#94a3b8" font-size="11" text-anchor="middle">https://nomatic-remember.app • 🔒 Cloud Sync &amp; Telegram Push Active</text>

  <!-- App Navbar -->
  <g transform="translate(15, 55)">
    <rect width="1170" height="65" fill="url(#headerGrad)" stroke="#1e293b" stroke-width="1" />
    
    <!-- Bulb Logo -->
    <g transform="translate(35, 12)">
      <rect width="40" height="40" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
      <circle cx="20" cy="18" r="8" fill="#fbbf24" filter="url(#bulbGlow)" />
      <path d="M 17 26 L 23 26" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
      <path d="M 18 29 L 22 29" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- App Title -->
    <text x="90" y="34" fill="#f8fafc" font-size="20" font-weight="700">Nomatic Remember</text>
    <text x="90" y="49" fill="#94a3b8" font-size="12">Smart Deadline &amp; Telegram Assistant</text>

    <!-- Header Stats Badges -->
    <g transform="translate(730, 16)">
      <!-- Live Status Badge -->
      <rect width="125" height="32" rx="16" fill="#064e3b" stroke="#059669" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="21" fill="#34d399" font-size="12" font-weight="600">LIVE SYNC</text>

      <!-- Telegram Bot Badge -->
      <g transform="translate(140, 0)">
        <rect width="145" height="32" rx="16" fill="#0c4a6e" stroke="#0284c7" stroke-width="1" />
        <circle cx="16" cy="16" r="4" fill="#38bdf8" />
        <text x="28" y="21" fill="#7dd3fc" font-size="12" font-weight="600">@NomaticBot</text>
      </g>

      <!-- Settings Icon Button -->
      <g transform="translate(300, 0)">
        <rect width="32" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="16" y="21" fill="#cbd5e1" font-size="14" text-anchor="middle">⚙️</text>
      </g>
    </g>
  </g>

  <!-- Main Content Grid -->
  <g transform="translate(45, 140)">
    
    <!-- Top 4 Metric Cards -->
    <!-- Card 1: Total Tasks -->
    <g transform="translate(0, 0)">
      <rect width="260" height="90" rx="12" fill="#111827" stroke="#1f2937" stroke-width="1" />
      <text x="20" y="32" fill="#9ca3af" font-size="13" font-weight="500">📋 Total Reminders</text>
      <text x="20" y="68" fill="#f9fafb" font-size="30" font-weight="800">18</text>
      <circle cx="225" cy="45" r="18" fill="#1f2937" />
      <text x="225" y="50" font-size="16" text-anchor="middle">📌</text>
    </g>

    <!-- Card 2: Due Today -->
    <g transform="translate(285, 0)">
      <rect width="260" height="90" rx="12" fill="#111827" stroke="#b45309" stroke-width="1" />
      <text x="20" y="32" fill="#fbbf24" font-size="13" font-weight="500">⏰ Due Today</text>
      <text x="20" y="68" fill="#fde047" font-size="30" font-weight="800">4</text>
      <circle cx="225" cy="45" r="18" fill="#78350f" fill-opacity="0.5" />
      <text x="225" y="50" font-size="16" text-anchor="middle">🔥</text>
    </g>

    <!-- Card 3: Telegram Connected -->
    <g transform="translate(570, 0)">
      <rect width="260" height="90" rx="12" fill="#111827" stroke="#0284c7" stroke-width="1" />
      <text x="20" y="32" fill="#38bdf8" font-size="13" font-weight="500">🤖 Telegram Bot</text>
      <text x="20" y="66" fill="#e0f2fe" font-size="20" font-weight="700">Connected</text>
      <text x="20" y="80" fill="#0284c7" font-size="11">Exact-time Push Enabled</text>
      <circle cx="225" cy="45" r="18" fill="#075985" fill-opacity="0.4" />
      <text x="225" y="50" font-size="16" text-anchor="middle">⚡</text>
    </g>

    <!-- Card 4: Rollback & Backups -->
    <g transform="translate(855, 0)">
      <rect width="255" height="90" rx="12" fill="#111827" stroke="#6d28d9" stroke-width="1" />
      <text x="20" y="32" fill="#c084fc" font-size="13" font-weight="500">💾 Safe Snapshots</text>
      <text x="20" y="68" fill="#f3e8ff" font-size="30" font-weight="800">9</text>
      <text x="60" y="66" fill="#a855f7" font-size="12">Rollback Ready</text>
      <circle cx="220" cy="45" r="18" fill="#4c1d95" fill-opacity="0.5" />
      <text x="220" y="50" font-size="16" text-anchor="middle">🛡️</text>
    </g>

    <!-- Lower Section: Left Side (Create & Bot Hub) + Right Side (Active Reminders List) -->
    
    <!-- LEFT PANEL: Quick Add & Telegram Link -->
    <g transform="translate(0, 110)">
      <!-- Telegram Status Banner Card -->
      <rect width="440" height="95" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="36" cy="46" r="20" fill="#0284c7" fill-opacity="0.2" />
      <text x="36" y="52" font-size="20" text-anchor="middle">✈️</text>
      
      <text x="70" y="38" fill="#f8fafc" font-size="15" font-weight="600">Telegram Instant Alerts Active</text>
      <text x="70" y="56" fill="#94a3b8" font-size="12">Bot token verified • Receiving notifications on phone</text>
      
      <!-- Quick Test & Backup Buttons -->
      <rect x="70" y="65" width="105" height="22" rx="6" fill="#0369a1" />
      <text x="122" y="80" fill="#f0f9ff" font-size="11" font-weight="600" text-anchor="middle">📲 Test Alert</text>

      <rect x="185" y="65" width="115" height="22" rx="6" fill="#475569" />
      <text x="242" y="80" fill="#f1f5f9" font-size="11" font-weight="600" text-anchor="middle">💾 Snapshot Now</text>

      <!-- Task Creator Form Card -->
      <g transform="translate(0, 110)">
        <rect width="440" height="280" rx="12" fill="#111827" stroke="#1f2937" stroke-width="1" />
        
        <text x="20" y="30" fill="#f3f4f6" font-size="15" font-weight="700">✨ Add New Reminder</text>
        <text x="20" y="48" fill="#9ca3af" font-size="11">Type naturally or specify date, category, and recurrence</text>

        <!-- Title Input -->
        <rect x="20" y="60" width="400" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="32" y="84" fill="#f8fafc" font-size="13">Client quarterly strategy review at 4:30 PM</text>

        <!-- Options Row -->
        <g transform="translate(20, 110)">
          <!-- Category Chip -->
          <rect width="85" height="28" rx="6" fill="#065f46" stroke="#059669" stroke-width="1" />
          <text x="42" y="18" fill="#6ee7b7" font-size="11" font-weight="600" text-anchor="middle">💼 Work</text>

          <!-- Priority Chip -->
          <rect x="95" width="85" height="28" rx="6" fill="#7f1d1d" stroke="#dc2626" stroke-width="1" />
          <text x="137" y="18" fill="#fca5a5" font-size="11" font-weight="600" text-anchor="middle">🔴 High (P1)</text>

          <!-- Recurrence Chip -->
          <rect x="190" width="105" height="28" rx="6" fill="#312e81" stroke="#4f46e5" stroke-width="1" />
          <text x="242" y="18" fill="#c7d2fe" font-size="11" font-weight="600" text-anchor="middle">🔁 Daily Repeat</text>

          <!-- Advance Alert -->
          <rect x="305" width="95" height="28" rx="6" fill="#713f12" stroke="#d97706" stroke-width="1" />
          <text x="352" y="18" fill="#fde68a" font-size="11" font-weight="600" text-anchor="middle">⏰ 15m Early</text>
        </g>

        <!-- Due Date Field -->
        <rect x="20" y="150" width="400" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="32" y="172" fill="#94a3b8" font-size="12">📅 Today at 4:30 PM (Auto-calculated)</text>

        <!-- Quick Tag helper -->
        <text x="20" y="205" fill="#64748b" font-size="11">💡 Tip: You can also text this directly to your Telegram Bot anytime!</text>

        <!-- Submit Button -->
        <rect x="20" y="222" width="400" height="42" rx="8" fill="url(#amberGrad)" />
        <text x="220" y="248" fill="#78350f" font-size="14" font-weight="700" text-anchor="middle">⚡ Schedule &amp; Sync to Telegram</text>
      </g>
    </g>

    <!-- RIGHT PANEL: Live Reminders Stream -->
    <g transform="translate(460, 110)">
      <rect width="650" height="390" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      
      <!-- Panel Header -->
      <text x="24" y="32" fill="#f8fafc" font-size="16" font-weight="700">Upcoming Deadlines &amp; Tasks</text>
      <text x="540" y="32" fill="#38bdf8" font-size="12" font-weight="500">Filter: Active (4)</text>

      <!-- Reminder Item 1 (Urgent Due in 15m) -->
      <g transform="translate(20, 50)">
        <rect width="610" height="74" rx="10" fill="#1e293b" stroke="#dc2626" stroke-width="1.5" />
        <circle cx="28" cy="37" r="12" fill="#0b0f19" stroke="#ef4444" stroke-width="2" />
        <text x="56" y="30" fill="#f8fafc" font-size="14" font-weight="600">Product Launch Sync with Marketing Team</text>
        <text x="56" y="52" fill="#f87171" font-size="12">⏰ Due at 4:30 PM (in 18 minutes!) • 🔁 Daily</text>
        
        <!-- Tags on Right -->
        <rect x="420" y="18" width="75" height="24" rx="12" fill="#7f1d1d" />
        <text x="457" y="34" fill="#fecaca" font-size="11" font-weight="600" text-anchor="middle">URGENT</text>

        <rect x="505" y="18" width="90" height="24" rx="6" fill="#0284c7" />
        <text x="550" y="34" fill="#f0f9ff" font-size="11" font-weight="600" text-anchor="middle">✈️ Bot Alert</text>
      </g>

      <!-- Reminder Item 2 (Evening Task) -->
      <g transform="translate(20, 134)">
        <rect width="610" height="74" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="28" cy="37" r="12" fill="#0b0f19" stroke="#94a3b8" stroke-width="2" />
        <text x="56" y="30" fill="#f8fafc" font-size="14" font-weight="600">Review AWS Server Invoices &amp; Budget Log</text>
        <text x="56" y="52" fill="#94a3b8" font-size="12">⏰ Today at 6:00 PM • 🏷️ Finance • 🔔 30m Advance Notice</text>

        <rect x="440" y="18" width="70" height="24" rx="12" fill="#065f46" />
        <text x="475" y="34" fill="#a7f3d0" font-size="11" font-weight="600" text-anchor="middle">Finance</text>

        <rect x="520" y="18" width="75" height="24" rx="6" fill="#334155" />
        <text x="557" y="34" fill="#cbd5e1" font-size="11" text-anchor="middle">⏳ Snooze</text>
      </g>

      <!-- Reminder Item 3 (Tomorrow Morning) -->
      <g transform="translate(20, 218)">
        <rect width="610" height="74" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="28" cy="37" r="12" fill="#0b0f19" stroke="#94a3b8" stroke-width="2" />
        <text x="56" y="30" fill="#f8fafc" font-size="14" font-weight="600">Morning 5km Jog &amp; Electrolyte Hydration</text>
        <text x="56" y="52" fill="#94a3b8" font-size="12">⏰ Tomorrow at 7:00 AM • 🔁 Weekdays • 🏷️ Health</text>

        <rect x="445" y="18" width="65" height="24" rx="12" fill="#3730a3" />
        <text x="477" y="34" fill="#c7d2fe" font-size="11" font-weight="600" text-anchor="middle">Health</text>

        <rect x="520" y="18" width="75" height="24" rx="6" fill="#334155" />
        <text x="557" y="34" fill="#cbd5e1" font-size="11" text-anchor="middle">⏳ Snooze</text>
      </g>

      <!-- Reminder Item 4 (Completed) -->
      <g transform="translate(20, 302)">
        <rect width="610" height="66" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1" opacity="0.6" />
        <circle cx="28" cy="33" r="12" fill="#10b981" />
        <text x="28" y="37" fill="#ffffff" font-size="12" text-anchor="middle">✓</text>
        <text x="56" y="28" fill="#9ca3af" font-size="14" text-decoration="line-through">Submit Weekly Project Status to Slack</text>
        <text x="56" y="48" fill="#10b981" font-size="11">✓ Completed via Telegram /done command at 1:15 PM</text>
      </g>
    </g>

  </g>
</svg>
